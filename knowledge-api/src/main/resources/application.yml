server:
  port: 8080

spring:
  application:
    name: knowledge-qa
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/knowledge_qa?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Milvus配置
milvus:
  host: localhost
  port: 19530
  collection-name: knowledge_vectors

# 智谱AI配置
zhipu:
  api-key: 0d5462f8cc444939ad48e8f2ed3cf1ef.Zx8uFDcBDOMzFzwX
  model: glm-4.5-air
  embedding-model: embedding-3

# DeepSeek AI配置 (OpenAI兼容接口) deepseek-chat
deepseek:
  api-key: sk-68f8259100f4446eaeeb802ede84ad01
  model: deepseek-v4-flash
  base-url: https://api.deepseek.com
# RAG配置
rag:
  chunk-size: 500
  chunk-overlap: 50
  top-k: 5

# 文件存储配置
file:
  upload-path: ./uploads
