server:
  port: 8080

spring:
  application:
    name: knowledge-qa
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/knowledge_qa?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  profiles:
    active: local
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Milvus配置
milvus:
  host: localhost
  port: 19530
  collection-name: knowledge_vectors



# RAG配置
rag:
  chunk-size: 500
  chunk-overlap: 50
  top-k: 5
  # 混合检索
  hybrid-search-enabled: true
  bm25-top-k: 10
  vector-top-k: 10
  rrf-k: 60
  # 重排序
  rerank-enabled: true
  rerank-candidate-count: 15
  # 查询改写
  query-rewrite-enabled: true
  # 父子分块
  parent-child-enabled: true
  child-chunk-size: 200
  parent-chunk-size: 500

# 文件存储配置
file:
  upload-path: ./uploads

# Agent配置
agent:
  file-base-path: ./agent-files
  max-tool-iterations: 5
  max-history-messages: 20
